name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/quioba-web-to-apk-ydcgbz
      - claude/quioba-apk-mobile-awj6os
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # La app carga https://www.quioba.com en vivo dentro del WebView (ver capacitor.config.json),
      # así que el contenido de out/ nunca se muestra: solo hace falta un webDir válido para `cap sync`.
      - name: Prepare placeholder webDir for Capacitor
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Quioba</title></head><body>Loading Quioba...</body></html>
          HTML

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PquiobaAbiFilter=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quioba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK en una Release para poder descargarlo directamente
      # desde el movil (sin login ni descomprimir el zip del artefacto).
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk quioba-debug.apk
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" quioba-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quioba APK (debug) build ${{ github.run_number }}" \
            --notes "APK de depuracion (solo arm64-v8a) generada desde ${GITHUB_SHA}. Instalar permitiendo origenes desconocidos." \
            --latest
